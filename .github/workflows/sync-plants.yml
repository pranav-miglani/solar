name: Sync Plants (Cron)

on:
  schedule:
    # Run every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  sync-plants:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Trigger Plant Sync
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          API_URL: ${{ secrets.API_URL || 'https://your-domain.com' }}
        run: |
          echo "🔄 [GitHub Actions] Triggering plant sync at $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
          
          response=$(curl -s -w "\n%{http_code}" -X GET \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "User-Agent: GitHub Actions (sync-plants workflow)" \
            -H "Content-Type: application/json" \
            "${API_URL}/api/cron/sync-plants")
          
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          
          echo "📊 [GitHub Actions] Response Status: $http_code"
          echo "📄 [GitHub Actions] Response Body: $body"
          
          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            echo "✅ [GitHub Actions] Plant sync triggered successfully"
          else
            echo "❌ [GitHub Actions] Plant sync failed with status $http_code"
            echo "$body"
            exit 1
          fi

