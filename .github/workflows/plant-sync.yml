name: Invoke Sync Plants API

on:
  schedule:
    - cron: "30 20 * * *"   # Runs daily at 2:00 AM IST
  workflow_dispatch:         # Allow manual run

jobs:
  call_api:
    runs-on: ubuntu-latest
    steps:
      - name: Call sync API
        run: curl -s -X GET "https://solarhome.space/api/cron/sync-plants"

