# Nginx Configuration with New Relic Integration
# Add this to your main nginx.conf or include it in http block

# Enable Nginx status module for New Relic monitoring
# This should be in the server block that listens on localhost
server {
    listen 127.0.0.1:80;
    server_name localhost;
    
    location /nginx_status {
        stub_status on;
        access_log off;
        allow 127.0.0.1;
        deny all;
    }
}

# Main server block - update your existing server block with these settings
server {
    listen 80;
    server_name your-domain.com;  # Update with your domain
    
    # Increase buffer sizes for large requests
    client_max_body_size 10M;
    client_body_buffer_size 128k;
    
    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Proxy settings for Next.js app
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        
        # Headers for New Relic distributed tracing
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # New Relic specific headers (preserve distributed tracing)
        proxy_set_header X-NewRelic-ID $http_x_newrelic_id;
        proxy_set_header X-NewRelic-Transaction-ID $http_x_newrelic_transaction_id;
        proxy_set_header X-NewRelic-Trace-Context $http_x_newrelic_trace_context;
        
        # WebSocket support (if needed)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Buffering
        proxy_buffering off;
        proxy_cache off;
    }
    
    # Health check endpoint (bypass proxy for faster response)
    location /api/health {
        proxy_pass http://127.0.0.1:3000/api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }
    
    # Static files caching (if serving static files through Nginx)
    location /_next/static {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, immutable";
    }
    
    # Logging
    access_log /var/log/nginx/woms-access.log;
    error_log /var/log/nginx/woms-error.log;
}

